name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  # Lets us dry-run the full build matrix (no publish) before cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: try-x86_64-linux
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: try-aarch64-linux
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: try-x86_64-darwin
            native: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: try-aarch64-darwin
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run spec compliance tests
        if: matrix.native
        run: bash spec/tests/runner.sh ./target/${{ matrix.target }}/release/try

      - name: Stage artifact
        run: install -m 0755 target/${{ matrix.target }}/release/try ${{ matrix.artifact }}

      - name: Checksum
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    # Only a tag push publishes; a workflow_dispatch run stops after `build`.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS and verify every platform is present
        run: |
          set -eu
          cd dist
          for artifact in try-x86_64-linux try-aarch64-linux try-x86_64-darwin try-aarch64-darwin; do
            if [ ! -f "$artifact" ]; then
              echo "::error::missing release artifact: $artifact"
              exit 1
            fi
          done
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          shasum -a 256 -c SHA256SUMS
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/try-x86_64-linux
            dist/try-aarch64-linux
            dist/try-x86_64-darwin
            dist/try-aarch64-darwin
            dist/SHA256SUMS
